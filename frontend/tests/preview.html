<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive QA harness</title><style>body{margin:0;background:#e9eeee;font:13px system-ui;color:#103c50}header{padding:12px;display:flex;gap:8px;flex-wrap:wrap}button,select{padding:8px;background:white;border:1px solid #aac5cc;border-radius:6px;color:inherit}#stage{position:relative;overflow:hidden}iframe{border:0;transform-origin:top left;background:#f8faf9}p{margin:10px 12px;font-size:11px}</style><header><select id="width" aria-label="Viewport width"><option value="1440">Desktop · 1440px</option><option value="834">Tablet · 834px</option><option value="390">Mobile · 390px</option><option value="320">Small mobile · 320px</option></select><select id="route" aria-label="Page"><option value="/">Overview</option><option value="/assessment">Assessment</option><option value="/research">Research</option><option value="/methodology">Methodology</option><option value="/health">Kidney health</option></select><button id="inspect">Check layout</button><button id="next-block">Next content block</button><button id="top">Return to top</button></header><p id="status" role="status">Scaled viewport for layout inspection; not a patient record.</p><div id="stage"><iframe title="Responsive application preview" src="../index.html#/" width="1440" height="1050"></iframe></div><script>
const frame=document.querySelector('iframe');
function resize(){const width=Number(document.querySelector('#width').value);const ratio=Math.min(1,document.documentElement.clientWidth/width);frame.width=width;frame.style.transform=`scale(${ratio})`;document.querySelector('#stage').style.height=`${1050*ratio}px`;}
document.querySelector('#width').onchange=resize;window.onresize=resize;resize();
document.querySelector('#route').onchange=e=>frame.src='../index.html#'+e.target.value;
let blockIndex=0;
document.querySelector('#next-block').onclick=()=>{const blocks=[...frame.contentDocument.querySelectorAll('.section,.page-shell .panel,.prose section')];blocks[blockIndex++ % blocks.length]?.scrollIntoView({behavior:'instant'});};
document.querySelector('#top').onclick=()=>{frame.contentWindow.scrollTo({top:0,behavior:'instant'});blockIndex=0;};
document.querySelector('#inspect').onclick=()=>{
 const doc=frame.contentDocument,win=frame.contentWindow;
 const width=doc.documentElement.clientWidth;
 const text=[...doc.querySelectorAll('main p,main label,main small,main button,main select,main .eyebrow,nav a')].filter(e=>e.getClientRects().length);
 const tiny=text.filter(e=>parseFloat(win.getComputedStyle(e).fontSize)<13).map(e=>e.className||e.tagName);
 const clipped=[...doc.querySelectorAll('h1,h2,h3,p,.button,.eyebrow')].filter(e=>e.scrollWidth>e.clientWidth+2 && e.clientWidth>0 && win.getComputedStyle(e).display!=='inline').map(e=>({tag:e.tagName,text:e.textContent.slice(0,55)}));
 document.querySelector('#status').textContent=JSON.stringify({ready:!doc.querySelector('.loading'),page:doc.title,width,documentWidth:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>width,tiny,clipped,inputSizes:[...new Set([...doc.querySelectorAll('input,select')].map(e=>win.getComputedStyle(e).fontSize))],revealed:doc.querySelectorAll('.is-revealed').length,visibleBlocks:[...doc.querySelectorAll('.capability')].filter(e=>e.getBoundingClientRect().top<win.innerHeight && e.getBoundingClientRect().bottom>0).map(e=>({state:e.className,opacity:win.getComputedStyle(e).opacity,delay:e.style.getPropertyValue('--reveal-delay')})),pendingReveals:doc.querySelectorAll('.reveal-ready:not(.is-revealed)').length});
};
</script></html>
